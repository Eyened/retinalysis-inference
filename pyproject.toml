[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinalysis-inference"
dynamic = ["version"]
description = "Retinal model inference package"
authors = [{ name = "Jose Vargas", email = "j.vargasquiros@erasmusmc.nl" }]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy == 2.*",
    "pandas == 2.*",
    "opencv-python == 4.*",
    "Pillow>=11,<13",
    "simplejpeg==1.*",
    "lightning==2.*",
    "torch>=2.4.1,<3",
    "torchvision>=0.19,<1",
    "albumentations==1.3.1",
    "monai==1.5.1",
    "huggingface-hub",
    "pydantic>=2.0,<3.0",
    "retinalysis-fundusprep>=1.3,<2",
    "torchmetrics>=0.7.0",
    "tqdm>=4,<5",
    "typing_extensions>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbstripout==0.3.9"]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
include = ["rtnls_inference*"]

[project.urls]
"Homepage" = "https://github.com/Eyened/retinalysis-inference"
"Bug Tracker" = "https://github.com/Eyened/retinalysis-inference/issues"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"