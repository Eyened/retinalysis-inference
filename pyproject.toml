[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinalysis-inference"
dynamic = ["version"]
description = "Retinal model inference package"
authors = [{ name = "Jose Vargas", email = "j.vargasquiros@erasmusmc.nl" }]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy == 2.*",
    "pandas == 2.*",
    "opencv-python == 4.*",
    "joblib==1.*",
    "Pillow == 11.*",
    "simplejpeg==1.*",
    "click==8.*",
    "nbstripout==0.3.9",
    "lightning==2.*",
    "albumentations==1.3.1",
    "PyYAML>=5.4",
    "monai==1.5.1",
    "huggingface-hub",
    "GPUtil==1.*",
    "pydantic>=2.0,<3.0",
    "scikit-image>=0.22",
    "networkx>=3.0",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
include = ["rtnls_inference*"]

[project.urls]
"Homepage" = "https://github.com/Eyened/retinalysis-inference"
"Bug Tracker" = "https://github.com/Eyened/retinalysis-inference/issues"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"